<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gallery-feed" content="./results.json">
  <title>Sequence Library · Harmonic-AM</title>
  <link rel="stylesheet" href="./gallery.css?v=2890bd1bda9d">
  <script src="./gallery.js?v=680c1691c5f3" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <span class="brand">Harmonic-AM</span>
      <span id="status" role="status">Opening the search library</span>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Sequence Library</h1>
      <p>Listen to paths found by exact voice-leading searches. At each move, the bass and one upper voice move a semitone in opposite directions.</p>
      <div class="progress">
        <div><strong id="result-count">0 sequences</strong><span id="search-progress"></span></div>
        <progress id="progress-bar" aria-label="Search progress" hidden></progress>
        <time id="published-at" hidden></time>
      </div>
    </section>
    <section id="results" aria-label="Sequence results"></section>
    <button id="show-more" type="button" hidden>Show more sequences</button>
    <p id="playback-error" role="alert" hidden></p>
  </main>
  <template id="result-template">
    <article class="result">
      <header class="result-header">
        <div>
          <div class="evidence"></div>
          <h2></h2>
        </div>
        <button class="play" type="button">▶ Play</button>
      </header>
      <div class="score" tabindex="0" role="region" aria-label="Scrollable score"><canvas role="img"></canvas></div>
      <p class="question"></p>
      <p class="answer"></p>
      <details class="explanation" hidden>
        <summary>Why it’s unique</summary>
      </details>
      <details class="relaxations">
        <summary>What changes when a checkpoint is removed?</summary>
        <p class="relaxation-rule"></p>
        <dl></dl>
      </details>
    </article>
  </template>
</body>
</html>
